<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events ✿</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Fredoka', sans-serif;
}

body{ background:#fff7f5; overflow-x:hidden; color:#6d7c6d; }
/* soft blobs */
body::before{
content:'';
position:fixed;
width:400px;
height:400px;
background:#ffd6df;
filter:blur(120px);
top:-120px;
left:-120px;
z-index:-1;
opacity:0.7;
}

body::after{
content:'';
position:fixed;
width:400px;
height:400px;
background:#d9ead7;
filter:blur(120px);
bottom:-120px;
right:-120px;
z-index:-1;
opacity:0.7;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:40px 8%;
}

.logo{
font-size:3rem;
font-weight:700;
color:#738673;
}

nav ul{
display:flex;
gap:50px;
list-style:none;
}

nav a{
text-decoration:none;
font-size:1.2rem;
font-weight:600;
color:#6f7f6f;
transition:0.3s;
}

nav a:hover{
color:#ff92ac;
}

/* TITLE */
.header{
text-align:center;
padding:40px 8%;
}

.header h1{
font-size:4rem;
color:#6f7f6f;
}

.header p{
letter-spacing:4px;
text-transform:uppercase;
color:#ff9bb0;
margin-top:10px;
}

/* 2 COLUMN LAYOUT */
.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:40px 8%;
}

/* LEFT - GALLERY */
.gallery{
background:rgba(255,255,255,0.7);
backdrop-filter:blur(10px);
border-radius:35px;
padding:30px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.gallery h2{
margin-bottom:20px;
font-size:2rem;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.grid img{
width:100%;
height:160px;
object-fit:cover;
border-radius:20px;
transition:0.3s;
}

.grid img:hover{
transform:scale(1.05);
}

/* RIGHT - UPCOMING */
.upcoming{
background:rgba(255,255,255,0.7);
backdrop-filter:blur(10px);
border-radius:35px;
padding:30px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.upcoming h2{
margin-bottom:20px;
font-size:2rem;
}

.event{
background:#ffd8e1;
padding:20px;
border-radius:25px;
margin-bottom:15px;
transition:0.3s;
}

.event:hover{
transform:translateY(-5px);
background:#d8ead4;
}

.event h3{
margin-bottom:8px;
}

.event p{
font-size:0.95rem;
line-height:1.5;
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:20px;
padding:15px 25px;
border-radius:999px;
background:#d8ead4;
text-decoration:none;
color:#5f6f5f;
font-weight:600;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
background:#ffd8e1;
}

/* FOOTER */
footer{
text-align:center;
padding:40px;
margin-top:40px;
}

footer h3{
font-size:2rem;
margin-bottom:10px;
}

/* MOBILE */
@media(max-width:768px){

.logo{
font-size:2.3rem;
}

nav{
flex-direction:column;
gap:20px;
text-align:center;
}

nav ul{
gap:25px;
flex-wrap:wrap;
justify-content:center;
}

.header h1{
font-size:2.8rem;
}

.container{
grid-template-columns:1fr;
padding:30px 6%;
}

.grid img{
height:140px;
}

}

</style>
</head>

<body>
<div class="page-container"></div>
<!-- NAV -->
<nav>
<div class="logo">♡ events ♡</div>

<ul>
<li><a href="home.html">home</a></li>
<li><a href="about.html">about</a></li>
<li><a href="portfolio.html">projects</a></li>
</ul>
</nav>

<!-- HEADER -->
<div class="header">
<h1>market journey ✿</h1>
<p>events • booths • memories</p>
</div>

<!-- MAIN 2 COLUMNS -->
<div class="container">

<!-- LEFT -->
<div class="gallery">
<h2>past markets ♡</h2>

<div class="grid">

<!-- replace these images anytime -->
<img src="">
<img src="">
<img src="">
<img src="">

</div>
</div>

<!-- RIGHT -->
<div class="upcoming">

<h2>upcoming markets ✿</h2>

<div class="event">
<h3>Clara Events UP Market</h3>
<p>📍 UP GYUDFOOD, Quezon City • 📅 June 26-28, 2026</p>
</div>

</div>

</div>

<footer>
<h3>♡ Love, She Charms Studio ♡</h3>
<div class="socials">
<a href="https://www.instagram.com/loveshecharms?igsh=YXQ5b2ZscjBycjY2&utm_source=qr">instagram</a>
<a href="https://www.tiktok.com/@loveshecharms?_r=1&_t=ZS-96XB4oxd617">tiktok</a>
<a href="https://pin.it/1V0P5yD1V">pinterest</a>
</div>
<p>made with love, sparkles, and tiny charms ✧</p>
</footer>


<script>
document.querySelectorAll('.btn').forEach(button=>{
button.addEventListener('mouseenter',()=>{
button.style.transform='translateY(-5px) scale(1.05)';
})

button.addEventListener('mouseleave',()=>{
button.style.transform='translateY(0px) scale(1)';
})
})
</script>
</body>
</html>
